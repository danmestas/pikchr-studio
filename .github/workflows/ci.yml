name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chrome
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chrome

      # The prebuilt public/pikchr.js + public/pikchr.wasm are committed;
      # Pikchr's own sources are not in this repository, so CI tests the bundle.
      - name: Unit tests
        run: npm run test:unit

      - name: Native API checks
        run: npm run test:native

      - name: Browser tests
        run: npm run test:browser

      - name: Validate Worker config
        run: npx --yes wrangler@4.138.0 deploy --dry-run --outdir dist-dry-run
